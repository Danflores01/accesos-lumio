<!doctype html>
<html lang="es" data-paleta="historia_azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFD400">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sitio.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<title>SparkEd · Tu guía está lista</title>
</head>
<body class="sitio">
<header class="cab"><div class="contenedor"><a class="marca" href="index.html"><svg class="rayo" viewBox="0 0 60 100"><polygon points="25,0 43,0 33,36 45,36 17,100 24,56 15,56" fill="#FFD400"/></svg>Spark<span>Ed</span></a></div></header>
<main class="flujo"><div class="contenedor"><section class="panel-paso" id="caja"><div class="estado-carga"><div>Confirmando tu compra…</div></div></section></div></main>
<script type="module">
import { api, esc, mensajeWhatsApp, waLink, CONFIG, textoPagoPendiente, PAGO_VIVO, pantallaEspera } from "./js/flujo.js";
import { sparky } from "./js/arte.js";
const params = new URLSearchParams(location.search);
const compra = params.get("compra") || params.get("external_reference") || params.get("session_id") || (() => { try { return localStorage.getItem("sparked_compra"); } catch { return null; } })();
// Al regresar de Mercado Pago la dirección trae ?pago=pendiente o ?pago=fallido y sus propios datos del pago.
const regreso = params.get("pago") || "";
const pagoId = params.get("payment_id") || params.get("collection_id") || "";
const estadoUrl = params.get("collection_status") || params.get("status") || "";
const tipoUrl = params.get("payment_type") || "";
const caja = document.getElementById("caja");
let vista = "";
// Solo se vuelve a dibujar cuando cambia lo que hay que mostrar (así no parpadea ni se pierde un botón a medio usar).
function pintar(clave, html) { if (clave === vista) return false; vista = clave; caja.innerHTML = html; return true; }

async function revisar() {
  if (!compra) { caja.innerHTML = `<h1>No encontramos tu compra</h1><p>Abre el link que te mandamos por correo o por WhatsApp, o vuelve a la <a href="index.html">página principal</a>.</p>`; return; }
  try {
    const d = await api.get(`/pago/estado/${encodeURIComponent(compra)}${/^\d+$/.test(pagoId) ? `?pago=${pagoId}` : ""}`);
    if (d.estado === "pagada" && d.link) {
      // Entrega en dos tiempos: "¡Tu guía está lista!" solo cuando la guía completa ya existe.
      if (d.guia_lista !== false) { espera?.detener(); espera = null; vista = "lista"; mostrar(d); return; }
      if (d.revision) { revisando(d); setTimeout(revisar, 60000); return; }
      terminando(d); setTimeout(revisar, 5000); return;
    }
    const pagoMP = d.pago_mp || "";
    // Mercado Pago: pago pendiente (OXXO, SPEI o tarjeta en revisión).
    if (PAGO_VIVO.includes(pagoMP) || (!pagoMP && (regreso === "pendiente" || PAGO_VIVO.includes(estadoUrl)))) { pendiente(d); setTimeout(revisar, 15000); return; }
    // Mercado Pago: el pago no se completó (rechazado, cancelado o vencido).
    if (["rejected", "cancelled"].includes(pagoMP) || regreso === "fallido" || estadoUrl === "rejected") { fallido(d, pagoMP === "cancelled"); setTimeout(revisar, 15000); return; }
    pintar("esperando", `<div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div><h2>Esperando la confirmación del pago…</h2><p class="ayuda">Esta página se actualiza sola. Cuando se confirme el pago, también te mandamos tu guía por correo y por WhatsApp.</p></div>`);
    setTimeout(revisar, 5000);
  } catch (e) { pintar("error:" + e.message, `<p class="error">${esc(e.message)}</p>`); setTimeout(revisar, 8000); }
}
function pendiente(d) {
  const t = textoPagoPendiente(d, tipoUrl);
  pintar(["pendiente", d.metodo || tipoUrl, d.vence_en, d.ficha_url].join("|"), `<div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div><h2>${esc(t.titulo)}</h2></div>
    <div class="caja-clave">${t.html}</div>
    <p class="ayuda">Puedes cerrar esta página: no necesitas volver a pagar. Esta página se actualiza sola. Folio: <b>${esc(d.folio ?? "")}</b>.</p>`);
}
function fallido(d, vencido) {
  const nuevo = pintar("fallido:" + vencido, `<div style="display:flex;gap:14px;align-items:center">${sparky("triste", 5)}<div><h1>${vencido ? "El plazo para pagar terminó" : "El pago no se completó"}</h1><div class="ayuda">${esc(d.titulo ?? "")}</div></div></div>
    <p>${vencido ? "Mercado Pago canceló este pago porque no se completó a tiempo." : "Mercado Pago no pudo completar tu pago."} No se realizó ningún cargo. Puedes intentarlo de nuevo con tarjeta, en OXXO o por SPEI.</p>
    <div class="acciones"><button class="boton" id="otraVez">🔁 Intentar de nuevo</button><a class="boton linea" href="index.html">Volver al inicio</a></div>
    <p class="error" id="errOtraVez"></p>`);
  if (!nuevo) return;
  const boton = caja.querySelector("#otraVez");
  boton.onclick = async () => {
    boton.disabled = true; boton.textContent = "Abriendo Mercado Pago…";
    try { const r = await api.post(`/pago/reintentar/${encodeURIComponent(compra)}`); if (r.url) { location.href = r.url; return; } vista = ""; revisar(); }
    catch (err) { caja.querySelector("#errOtraVez").textContent = err.message; boton.disabled = false; boton.textContent = "🔁 Intentar de nuevo"; }
  };
}
// Pago (o código) confirmado, pero la guía completa todavía se está terminando (unos 4 minutos después del pago).
let espera = null;
const encabezado = (d) => d.metodo === "codigo" ? "Tu código se aplicó ✅" : "Tu pago se confirmó ✅";
function terminando(d) {
  document.title = "SparkEd · Tu guía se está terminando";
  if (pintar("terminando", `<div><h1 style="margin-bottom:4px">${encabezado(d)}</h1><div class="ayuda">${esc(d.titulo ?? "")}</div></div>
      <p>Tu guía completa se está terminando: tarda unos 4 minutos. Te avisamos por correo en cuanto esté lista.</p>
      <div id="espera"></div>
      ${cajaLink(d, d.jugar ? "Mientras se termina, ya puedes abrirla y jugar los primeros bloques." : "Se abre en cuanto la guía esté completa. Esta página cambia sola cuando esté lista.")}`)) {
    espera?.detener();
    espera = pantallaEspera(caja.querySelector("#espera"), "Terminando tu guía…", { estimado: 240, inicio: d.pagada_en ? new Date(d.pagada_en).getTime() : Date.now(), base: 42 });
    conectarLink(d);
  }
  const pr = d.progreso ?? {};
  espera?.actualizar(pr.pct ?? 42, pr.mensaje ?? "");
}
// El trabajo que termina la guía falló: Daniel ya recibió el aviso; la familia no tiene que hacer nada.
function revisando(d) {
  espera?.detener(); espera = null;
  document.title = "SparkEd · Estamos revisando tu guía";
  if (pintar("revisando", `<div style="display:flex;gap:14px;align-items:center">${sparky("escribiendo", 5)}<div><h1>${encabezado(d)}</h1><div class="ayuda">${esc(d.titulo ?? "")}</div></div></div>
      <div class="caja-clave"><b>Estamos revisando tu guía; te avisamos por correo en cuanto esté lista.</b><p style="margin:6px 0 0">No necesitas hacer nada más. Folio: <b>${esc(d.folio ?? "")}</b>.</p></div>
      ${cajaLink(d, d.jugar ? "Mientras tanto, ya puedes abrirla y jugar los primeros bloques." : "Tu link ya está apartado: se abre en cuanto la guía esté completa.")}`)) conectarLink(d);
}
function cajaLink(d, nota) {
  return `<div class="caja-clave" style="margin-top:14px"><b>Tu link</b><div class="link-caja" style="margin-top:6px">${esc(d.link)}</div><p class="ayuda" style="margin:6px 0">${esc(nota)}</p>
    <div class="acciones">${d.jugar ? `<a class="boton linea" href="${esc(d.link)}">▶ Abrir la guía</a>` : ""}<button class="boton linea" data-copiar>📋 Copiar link</button><a class="boton linea" target="_blank" rel="noopener" href="${esc(waLink(d.telefono ?? "", mensajeWhatsApp(d.titulo ?? "Tu guía", d.link)))}">💬 Mandar por WhatsApp</a></div></div>`;
}
function conectarLink(d) { const b = caja.querySelector("[data-copiar]"); if (b) b.onclick = async () => { try { await navigator.clipboard.writeText(d.link); b.textContent = "✓ Copiado"; } catch {} }; }

function mostrar(d) {
  document.title = "SparkEd · Tu guía está lista";
  const link = d.link; const titulo = d.titulo ?? "Tu guía";
  const qr = qrcode(0, "M"); qr.addData(link); qr.make();
  caja.innerHTML = `<div style="display:flex;gap:14px;align-items:center">${sparky("festejo", 6)}<div><h1>¡Tu guía está lista! 🎉</h1><div class="ayuda">${esc(titulo)}</div></div></div>
    <div style="display:grid;grid-template-columns:1fr;gap:16px" class="rejilla-campos entrega">
      <div class="entrega-qr"><div class="qr">${qr.createSvgTag({ cellSize: 5, margin: 2 })}</div><div class="ayuda" style="margin-top:6px">El alumno puede escanear este código con su iPad.</div></div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="link-caja" id="link">${esc(link)}</div>
        <div class="acciones"><a class="boton" href="${esc(link)}">▶ Abrir la guía</a><button class="boton linea" id="copiar">📋 Copiar link</button><a class="boton linea" id="wa" target="_blank" rel="noopener" href="${esc(waLink(d.telefono ?? "", mensajeWhatsApp(titulo, link)))}">💬 Mandar por WhatsApp</a></div>
      </div></div>
    <div class="caja-clave"><b>Cómo funciona tu acceso</b><ul style="margin:8px 0 0;padding-left:20px"><li>Tienes <b>7 días de acceso ilimitado a tu guía</b>, desde hoy${d.expira_en ? ` hasta el <b>${esc(new Date(d.expira_en).toLocaleString("es-MX", { dateStyle: "long", timeStyle: "short" }))}</b>` : ""}.</li><li>Se abre en <b>2 dispositivos</b>: por ejemplo, tu celular y el iPad del alumno. Al tercer dispositivo le aparece el aviso "Acceso en uso en otros dispositivos".</li><li>No lo compartas en otros chats: es de tu familia.</li><li>Guarda este link. También te mandamos tu guía por correo (a <b>${esc(d.correo ?? "tu correo")}</b>) y por WhatsApp.</li></ul></div>
    <div class="acciones"><a class="boton linea" href="index.html">✨ Crea otra guía</a></div>`;
  caja.querySelector("#copiar").onclick = async () => { try { await navigator.clipboard.writeText(link); caja.querySelector("#copiar").textContent = "✓ Copiado"; } catch {} };
}
revisar();
</script>
</body>
</html>
