<!doctype html>
<html lang="es" data-paleta="historia_azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFD400">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="48x48" href="img/iconos/sparky-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/iconos/sparky-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/iconos/sparky-180.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sitio.css">
<script>/* Idioma: si el visitante eligió inglés, se oculta la página un instante mientras idioma.js traduce (evita ver el español). */try{var l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("sparked_idioma");if(l==="en"){document.documentElement.lang="en";document.documentElement.classList.add("i18n-cargando");setTimeout(function(){document.documentElement.classList.remove("i18n-cargando")},2500)}}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<title data-i18n="titulo.listo">SparkEd · Tu guía está lista</title>
</head>
<body class="sitio">
<header class="cab"><div class="contenedor">
  <a class="marca" href="index.html"><svg class="rayo" viewBox="0 0 60 100"><polygon points="25,0 43,0 33,36 45,36 17,100 24,56 15,56" fill="#FFD400"/></svg>Spark<span>Ed</span></a>
  <nav><span class="idioma" role="group" aria-label="Idioma" data-i18n-attr="aria-label:nav.idioma"><button type="button" data-idioma="es" lang="es" aria-pressed="true">ES</button><span aria-hidden="true">|</span><button type="button" data-idioma="en" lang="en" aria-pressed="false">EN</button></span></nav>
</div></header>
<main class="flujo"><div class="contenedor"><section class="panel-paso" id="caja"><div class="estado-carga"><div data-i18n="listo.confirmando">Confirmando tu compra…</div></div></section></div></main>
<script type="module">
import { api, esc, mensajeWhatsApp, waLink, CONFIG, textoPagoPendiente, PAGO_VIVO, pantallaEspera, t, th, marca, poner, alCambiarIdioma, fecha, mensajeError } from "./js/flujo.js";
import { sparky } from "./js/arte.js";
const params = new URLSearchParams(location.search);
const compra = params.get("compra") || params.get("external_reference") || params.get("session_id") || (() => { try { return localStorage.getItem("sparked_compra"); } catch { return null; } })();
// Al regresar de Mercado Pago la dirección trae ?pago=pendiente o ?pago=fallido y sus propios datos del pago.
const regreso = params.get("pago") || "";
const pagoId = params.get("payment_id") || params.get("collection_id") || "";
const estadoUrl = params.get("collection_status") || params.get("status") || "";
const tipoUrl = params.get("payment_type") || "";
const caja = document.getElementById("caja");
const titulo = document.querySelector("title");
let vista = "";
// Solo se vuelve a dibujar cuando cambia lo que hay que mostrar (así no parpadea ni se pierde un botón a medio usar).
// Los textos llevan marcas data-i18n: al cambiar de idioma se traducen solos, sin volver a dibujar.
function pintar(clave, html) { if (clave === vista) return false; vista = clave; caja.innerHTML = html; return true; }
// Lo que no cabe en una marca simple (la guía lista, con su QR, fechas y botones) se vuelve a dibujar al cambiar de idioma.
let redibujar = null;
alCambiarIdioma(() => redibujar?.());

async function revisar() {
  if (!compra) { caja.innerHTML = `${marca("listo.sin_compra_t", null, "h1")}${marca("listo.sin_compra", null, "p")}`; return; }
  try {
    const d = await api.get(`/pago/estado/${encodeURIComponent(compra)}${/^\d+$/.test(pagoId) ? `?pago=${pagoId}` : ""}`);
    if (d.estado === "pagada") {
      // El link aparece solo cuando la guía está 100 % completa y verificada (entonces también sale el correo).
      if (d.link && d.guia_lista !== false) { espera?.detener(); espera = null; vista = "lista"; mostrar(d); return; }
      if (d.revision) { revisando(d); setTimeout(revisar, 60000); return; }
      terminando(d); setTimeout(revisar, 8000); return;
    }
    const pagoMP = d.pago_mp || "";
    // Mercado Pago: pago pendiente (OXXO, SPEI o tarjeta en revisión).
    if (PAGO_VIVO.includes(pagoMP) || (!pagoMP && (regreso === "pendiente" || PAGO_VIVO.includes(estadoUrl)))) { pendiente(d); setTimeout(revisar, 15000); return; }
    // Mercado Pago: el pago no se completó (rechazado, cancelado o vencido).
    if (["rejected", "cancelled"].includes(pagoMP) || regreso === "fallido" || estadoUrl === "rejected") { fallido(d, pagoMP === "cancelled"); setTimeout(revisar, 15000); return; }
    pintar("esperando", `<div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div>${marca("pago.esperando", null, "h2")}${marca("listo.esperando_nota", null, "p", 'class="ayuda"')}</div>`);
    setTimeout(revisar, 5000);
  } catch (e) { pintar("error:" + e.message, `<p class="error" data-i18n-servidor="${esc(e.message)}">${esc(mensajeError(e))}</p>`); setTimeout(revisar, 8000); }
}
function pendiente(d) {
  const tx = textoPagoPendiente(d, tipoUrl);
  pintar(["pendiente", d.metodo || tipoUrl, d.vence_en, d.ficha_url].join("|"), `<div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div>${marca(tx.tituloClave, null, "h2")}</div>
    <div class="caja-clave">${tx.html}</div>
    ${marca("listo.pendiente_nota", { folio: d.folio ?? "" }, "p", 'class="ayuda"')}`);
}
function fallido(d, vencido) {
  const nuevo = pintar("fallido:" + vencido, `<div style="display:flex;gap:14px;align-items:center">${sparky("triste", 5)}<div>${marca(vencido ? "listo.vencido_t" : "listo.fallido_t", null, "h1")}<div class="ayuda">${esc(d.titulo ?? "")}</div></div></div>
    ${marca(vencido ? "listo.vencido" : "listo.fallido", null, "p")}
    <div class="acciones">${marca("listo.reintentar", null, "button", 'class="boton" id="otraVez"')}<a class="boton linea" href="index.html" data-i18n="listo.inicio">${th("listo.inicio")}</a></div>
    <p class="error" id="errOtraVez"></p>`);
  if (!nuevo) return;
  const boton = caja.querySelector("#otraVez");
  boton.onclick = async () => {
    boton.disabled = true; poner(boton, "pago.abriendo");
    try { const r = await api.post(`/pago/reintentar/${encodeURIComponent(compra)}`); if (r.url) { location.href = r.url; return; } vista = ""; revisar(); }
    catch (err) { const e = caja.querySelector("#errOtraVez"); e.dataset.i18nServidor = err.message; e.textContent = mensajeError(err); boton.disabled = false; poner(boton, "listo.reintentar"); }
  };
}
// Pago (o código) confirmado, pero la guía completa todavía se está terminando y revisando (unos 4 minutos después del
// pago). Sin link ni botones: el link aparece aquí (y llega por correo) cuando la guía está lista.
let espera = null;
const encabezado = (d, etiqueta, extra) => marca(d.metodo === "codigo" ? "listo.codigo_ok" : "listo.pago_ok", null, etiqueta, extra);
function terminando(d) {
  poner(titulo, "titulo.terminando");
  if (pintar("terminando", `<div>${encabezado(d, "h1", 'style="margin-bottom:4px"')}<div class="ayuda">${esc(d.titulo ?? "")}</div></div>
      ${marca("listo.terminando", null, "p")}
      <div id="espera"></div>
      ${marca("listo.term_nota", null, "p", 'class="ayuda"')}`)) {
    espera?.detener();
    espera = pantallaEspera(caja.querySelector("#espera"), "espera.terminando", { estimado: 240, inicio: d.pagada_en ? new Date(d.pagada_en).getTime() : Date.now(), base: 42 });
  }
  const pr = d.progreso ?? {};
  espera?.actualizar(pr.pct ?? 42, pr.mensaje ?? "");
}
// El trabajo que termina la guía falló: Daniel ya recibió el aviso; la familia no tiene que hacer nada.
function revisando(d) {
  espera?.detener(); espera = null;
  poner(titulo, "titulo.revisando");
  pintar("revisando", `<div style="display:flex;gap:14px;align-items:center">${sparky("escribiendo", 5)}<div>${encabezado(d, "h1")}<div class="ayuda">${esc(d.titulo ?? "")}</div></div></div>
      <div class="caja-clave">${marca("listo.revisando", null, "b")}${marca("listo.revisando_nota", { folio: d.folio ?? "" }, "p", 'style="margin:6px 0 0"')}</div>`);
}

function mostrar(d) {
  poner(titulo, "titulo.listo");
  const link = d.link; const nombre = d.titulo ?? "";
  const qr = qrcode(0, "M"); qr.addData(link); qr.make();
  caja.innerHTML = `<div style="display:flex;gap:14px;align-items:center">${sparky("festejo", 6)}<div>${marca("listo.lista", null, "h1")}<div class="ayuda">${nombre ? esc(nombre) : marca("tu_guia")}</div></div></div>
    <div style="display:grid;grid-template-columns:1fr;gap:16px" class="rejilla-campos entrega">
      <div class="entrega-qr"><div class="qr">${qr.createSvgTag({ cellSize: 5, margin: 2 })}</div>${marca("listo.qr", null, "div", 'class="ayuda" style="margin-top:6px"')}</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="link-caja" id="link">${esc(link)}</div>
        <div class="acciones"><a class="boton" href="${esc(link)}" data-i18n="link.abrir">${th("link.abrir")}</a>${marca("link.copiar", null, "button", 'class="boton linea" id="copiar"')}<a class="boton linea" id="wa" target="_blank" rel="noopener" href="${esc(waLink(d.telefono ?? "", mensajeWhatsApp(nombre || t("tu_guia"), link)))}" data-i18n="link.whatsapp">${th("link.whatsapp")}</a></div>
      </div></div>
    <div class="caja-clave">${marca("listo.acceso_t", null, "b")}<ul style="margin:8px 0 0;padding-left:20px">${d.expira_en ? marca("listo.acceso1_fecha", { fecha: d.expira_en }, "li") : marca("listo.acceso1", null, "li")}${marca("listo.acceso2", null, "li")}${marca("listo.acceso3", null, "li")}${d.correo ? marca("listo.acceso4", { correo: d.correo }, "li") : `<li data-i18n-correo="" data-clave="listo.acceso4"></li>`}</ul></div>
    <div class="acciones"><a class="boton linea" href="index.html" data-i18n="listo.otra">${th("listo.otra")}</a></div>`;
  // Sin correo en la respuesta, el párrafo dice «tu correo» (lo rellena flujo.js con el idioma activo).
  const sinCorreo = caja.querySelector("li[data-clave]"); if (sinCorreo) sinCorreo.innerHTML = th("listo.acceso4", { correo: "\u0001" }).replace("\u0001", th("tu_correo"));
  caja.querySelector("#copiar").onclick = async () => { try { await navigator.clipboard.writeText(link); poner(caja.querySelector("#copiar"), "link.copiado"); } catch {} };
  const wa = caja.querySelector("#wa");
  redibujar = () => { wa.href = waLink(d.telefono ?? "", mensajeWhatsApp(nombre || t("tu_guia"), link)); };
}
revisar();
</script>
<script type="module" src="js/sin-internet.js"></script>
</body>
</html>
