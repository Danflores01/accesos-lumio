<script type="module">
// «Mi cuenta» de SparkEd (paquete de 3 guías). Una sola página con estas vistas:
//   entrar (WhatsApp → código de 6 dígitos) · mi cuenta (saldo, guías, paquetes, datos) · comprar el paquete ·
//   el regreso de Mercado Pago (?compra=…) · una guía que se está creando o ya está lista (?guia=…).
// El saldo vive en el servidor; aquí solo se guarda el pase de la sesión (js/cuenta.js).
// Suscripción mensual «Guías ilimitadas» (25 nov 2026): aquí se contrata (solo si el servidor dice que esta cuenta puede:
// abierta al público, o el número está en la lista de probadores), se ve cómo va y se cancela. Vistas: la caja de la
// suscripción dentro de «Mi cuenta», el regreso de Mercado Pago (?suscripcion=…) y cancelar (?cancelar=1, el link que
// llega en el aviso de renovación). La tarjeta se pone en Mercado Pago: esta página nunca la pide ni la ve.
import { api, esc, LADAS, ladaTexto, numeroSinLada, guardarContacto, contactoParaFormulario, pantallaEspera, PAGO_VIVO, mensajeWhatsApp, waLink, t, th, marca, poner, idioma, alCambiarIdioma, textoServidor, nombreGrado, nombreMateria, mensajeError } from "./js/flujo.js";
import { sparky } from "./js/arte.js";
import { cuentaApi, paseGuardado, guardarPase, olvidarPase, mostrarPaquete } from "./js/cuenta.js";

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const params = new URLSearchParams(location.search);
const esUuid = (x) => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(x ?? "");
const quiereComprar = params.get("comprar") === "paquete3";
// Suscripción: ?suscripcion=<id> es el regreso de Mercado Pago; ?cancelar=1 llega del aviso de renovación; ?suscribir=1, de paquetes.html.
const susUrl = esUuid(params.get("suscripcion")) ? params.get("suscripcion") : null;
const quiereCancelar = params.get("cancelar") === "1", quiereSuscribirse = params.get("suscribir") === "1";
const compraUrl = susUrl ? null : [params.get("compra"), params.get("external_reference")].find(esUuid) ?? null;
const guiaUrl = esUuid(params.get("guia")) ? params.get("guia") : null;
// Al regresar de Mercado Pago la dirección trae ?pago=pendiente o ?pago=fallido y sus propios datos del pago.
const regreso = params.get("pago") || "", pagoId = params.get("payment_id") || params.get("collection_id") || "";
const estadoUrl = params.get("collection_status") || params.get("status") || "", tipoUrl = params.get("payment_type") || "";
const CORREO_OK = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
let info = null, cuenta = null, espera = null, reloj = null, redibujar = null;

// ---------- Piezas ----------
function limpiar() { clearTimeout(reloj); reloj = null; espera?.detener(); espera = null; redibujar = null; }
function pintar(html, subir = true) { limpiar(); app.innerHTML = html; if (subir) window.scrollTo({ top: 0 }); }
alCambiarIdioma(() => { document.querySelectorAll("#c-lada option").forEach((o) => { o.textContent = ladaTexto(o.value); }); redibujar?.(); });
const sinError = (el) => { if (!el) return; delete el.dataset.i18n; delete el.dataset.i18nVars; delete el.dataset.i18nServidor; el.textContent = ""; };
const errorDe = (el, err) => { if (!el) return; sinError(el); el.dataset.i18nServidor = err?.message ?? ""; el.textContent = mensajeError(err); };
const quitarDeLaDireccion = (...claves) => { try { const u = new URL(location.href); for (const k of claves.length ? claves : [...u.searchParams.keys()]) if (k !== "lang") u.searchParams.delete(k); history.replaceState(null, "", u); } catch {} };
const cargando = (clave) => `<section class="panel-paso"><div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div>${marca(clave, null, "h2")}</div></section>`;
const DISPOSITIVOS_EN = { "Celular Android": "Android phone", "Tableta Android": "Android tablet", "Computadora con Windows": "Windows computer", "Computadora con Linux": "Linux computer", "Dispositivo": "Device" };
const nombreDispositivo = (n) => (idioma() === "en" && DISPOSITIVOS_EN[n || "Dispositivo"]) || n || "Dispositivo";
// La caja «Suscripción mensual» para quien todavía no entra (llegó con el link «¿Quieres cancelar tu suscripción?» de la portada).
const cajaSuscripcion = () => `<section class="panel-paso" id="suscripcion">${marca("cta.sus_t", null, "h2")}${marca("sus.entra_para_ver", null, "p")}</section>`;
const irASuscripcion = () => { if (location.hash === "#suscripcion" || quiereSuscribirse) document.getElementById("suscripcion")?.scrollIntoView({ block: "start" }); };

// ---------- Suscripción mensual «Guías ilimitadas»: lo que se ve dentro de «Mi cuenta» ----------
// El servidor manda cuenta.suscripcion = { disponible, precio, prueba_dias, con_prueba, primer_cobro_en, actual }.
// «disponible» solo es cierto si esta cuenta puede contratar ahora (abierta al público o número de la lista de probadores).
const sus = () => cuenta?.suscripcion ?? { disponible: false, actual: null };
const DIA_MS = 86400000;
// Renglón que dice cómo va la suscripción (se traduce solo al cambiar de idioma).
function estadoSus(a, etiqueta = "span") {
  const precio = a.precio, viva = a.estado === "en_prueba" || a.estado === "activa";
  if (a.estado === "en_prueba" && a.puede_crear) return marca("sus.e_prueba", { dia: a.prueba_hasta ?? a.periodo_fin, precio }, etiqueta);
  if (a.estado === "activa" && a.puede_crear) return marca("sus.e_activa", { dia: a.proximo_cobro ?? a.periodo_fin, precio }, etiqueta);
  if (viva) return marca("sus.e_esperando", null, etiqueta);
  if (a.estado === "cancelada") return a.puede_crear ? marca("sus.e_cancelada", { dia: a.hasta }, etiqueta) : a.periodo_fin ? marca("sus.e_terminada", { dia: a.periodo_fin }, etiqueta) : marca("sus.e_terminada_ya", null, etiqueta);
  if (a.estado === "en_gracia") return marca("sus.e_gracia", null, etiqueta);
  if (a.estado === "vencida") return marca("sus.e_vencida", null, etiqueta);
  if (a.estado === "pendiente") return marca(a.falta === "cobro" ? "sus.e_falta_cobro" : "sus.e_falta_tarjeta", null, etiqueta);
  return "";
}
// ¿Hay que llamar la atención? (un cobro que no pasó, o falta terminar algo en Mercado Pago)
const susConAlerta = (a) => !!a && (a.estado === "en_gracia" || a.estado === "pendiente" || ((a.estado === "en_prueba" || a.estado === "activa") && !a.puede_crear));
// La oferta con su casilla: el texto de la casilla es el mismo que el servidor guarda como aceptado.
function ofertaSus() {
  const s = sus(), precio = s.precio, c = cuenta.cuenta ?? {}, dias = s.prueba_dias ?? 7;
  const primer = s.con_prueba ? new Date(Date.now() + dias * DIA_MS).toISOString() : s.primer_cobro_en;
  const punto3 = s.con_prueba ? marca("sus.p3_prueba", { dias, dia: primer }, "li") : primer ? marca("sus.p3_diferido", { dia: primer }, "li") : marca("sus.p3_hoy", { precio }, "li");
  const acepto = s.con_prueba ? marca("sus.acepto_prueba", { dias, dia: primer, precio }) : primer ? marca("sus.acepto_diferido", { dia: primer, precio }) : marca("sus.acepto", { precio });
  return `<div class="resultado-guia"><div class="em" aria-hidden="true">♾️</div><div>${marca("sus.oferta", { precio })}</div></div>
    <ul class="sus-puntos">${marca("sus.p1", null, "li")}${marca("sus.p2", null, "li")}${punto3}${marca("sus.p4", null, "li")}</ul>
    <form id="f-sus" class="rejilla-campos" novalidate>
      ${c.nombre ? "" : `<div class="campo" style="grid-column:1/-1">${marca("cta.nombre", null, "label", 'for="s-nombre"')}<input id="s-nombre" name="nombre" autocomplete="name" maxlength="80" required></div>`}
      ${c.correo ? "" : `<div class="campo">${marca("cta.correo", null, "label", 'for="s-correo"')}<input id="s-correo" name="correo" type="email" autocomplete="email" maxlength="120" required></div>
      <div class="campo">${marca("cta.correo2", null, "label", 'for="s-correo2"')}<input id="s-correo2" name="correo2" type="email" autocomplete="off" maxlength="120" required></div>`}
      <div class="campo" style="grid-column:1/-1">${marca("sus.correo_pago", null, "label", 'for="s-correo-pago"')}<input id="s-correo-pago" name="correo_pago" type="email" autocomplete="email" maxlength="120">${c.correo ? marca("sus.correo_pago_ayuda_con", { correo: c.correo }, "div", 'class="ayuda"') : marca("sus.correo_pago_ayuda", null, "div", 'class="ayuda"')}</div>
      <label class="permiso sus-acepto" style="grid-column:1/-1"><input type="checkbox" name="acepta" id="s-acepta">${acepto}</label>
      <div class="acciones" style="grid-column:1/-1">${marca(s.con_prueba ? "sus.boton_prueba" : "sus.boton", { dias }, "button", 'class="boton" type="submit" id="suscribirme"')}${marca("sus.nota", null, "span", 'class="ayuda"')}</div>
      <div class="error" id="err-sus" style="grid-column:1/-1" role="alert"></div>
    </form>`;
}
// La sección completa. Sin suscripción y sin poder contratar (lo que ve hoy el público): el mismo texto de siempre.
function seccionSuscripcion() {
  const s = sus(), a = s.actual;
  if (!a && !s.disponible) return `<section class="panel-paso" id="suscripcion">${marca("cta.sus_t", null, "h2")}${marca("cta.sus_texto", null, "p")}</section>`;
  let cuerpo = "";
  if (a) {
    const alerta = susConAlerta(a);
    // Con derecho a crear, cómo va ya se dice arriba (en la caja «Guías ilimitadas»): aquí van el precio y el folio.
    cuerpo += a.puede_crear ? marca("sus.detalle", { precio: a.precio, folio: a.folio }, "p") : `<div class="aviso-saldo${alerta ? " alerta" : ""}"><span class="ico" aria-hidden="true">${alerta ? "⚠️" : "ℹ️"}</span>${estadoSus(a)}</div>`;
    if (a.estado === "pendiente" && a.link_pago) cuerpo += `<div class="acciones"><a class="boton" href="${esc(a.link_pago)}" data-i18n="sus.continuar_mp">${th("sus.continuar_mp")}</a>${marca("sus.descartar", null, "button", 'class="boton linea" type="button" id="cancelar-sus"')}</div>`;
    else if (a.puede_cancelar) cuerpo += `<div class="acciones">${marca("sus.cancelar", null, "button", 'class="boton linea" type="button" id="cancelar-sus"')}${marca("sus.cancelar_nota", null, "span", 'class="ayuda"')}</div>`;
  }
  if (s.disponible && a?.estado !== "pendiente") cuerpo += `${a ? marca("sus.volver_t", null, "b") : ""}${ofertaSus()}`;
  return `<section class="panel-paso" id="suscripcion">${marca("cta.sus_t", null, "h2")}${cuerpo}</section>`;
}
// «Suscribirme»: el servidor abre la suscripción en Mercado Pago y aquí solo se manda a la familia a esa página.
async function suscribirme(f) {
  const err = $("#err-sus"), boton = $("#suscribirme"), s = sus();
  const nombre = f.nombre ? f.nombre.value.trim() : "", correo = f.correo ? f.correo.value.trim().toLowerCase() : "", correoPago = f.correo_pago.value.trim().toLowerCase();
  if (f.nombre && nombre.length < 2) { poner(err, "cta.err_nombre"); f.nombre.focus(); return; }
  if (f.correo && !CORREO_OK.test(correo)) { poner(err, "contacto.err_correo"); f.correo.focus(); return; }
  if (f.correo && f.correo2.value.trim().toLowerCase() !== correo) { poner(err, "contacto.err_correo2"); f.correo2.focus(); return; }
  // El correo de la cuenta llega del servidor a medias (a•••@correo.com): ese nunca se manda; vacío = el de la cuenta.
  if (correoPago && (!CORREO_OK.test(correoPago) || correoPago.includes("•"))) { poner(err, "contacto.err_correo"); f.correo_pago.focus(); return; }
  if (!f.acepta.checked) { poner(err, "sus.err_acepta"); f.acepta.focus(); return; }
  boton.disabled = true; poner(boton, "pago.abriendo"); sinError(err);
  try {
    const r = await cuentaApi.post("/suscripcion/crear", { acepta: true, ...(nombre ? { nombre } : {}), ...(correo ? { correo } : {}), ...(correoPago ? { correo_pago: correoPago } : {}) });
    if (r.modo === "mercadopago" && /^https:\/\//.test(r.url ?? "")) { quitarDeLaDireccion(); location.href = r.url; return; }
    vistaRegresoSuscripcion();   // no hay página que abrir (ya estaba autorizada): se ve cómo va
  } catch (e) {
    if (e.status === 401) return sesionTermino();
    if (e.status === 409 && e.datos?.ya) return abrirCuenta();
    errorDe(err, e); boton.disabled = false; poner(boton, s.con_prueba ? "sus.boton_prueba" : "sus.boton", { dias: s.prueba_dias ?? 7 });
  }
}
// Falta que Mercado Pago confirme algo (la tarjeta o el primer cobro): se pregunta cada 15 segundos durante unos
// minutos y, si algo cambia, «Mi cuenta» se vuelve a pintar sola.
async function mirarPendiente(veces = 0) {
  try {
    const antes = JSON.stringify(sus().actual ?? null);
    const d = await cuentaApi.get("/suscripcion/estado");
    if (JSON.stringify(d.suscripcion?.actual ?? null) !== antes) { if (await cargarCuenta()) vistaCuenta(false); else sesionTermino(); return; }
  } catch (e) { if (e.status === 401) return sesionTermino(); }
  if (sus().actual?.estado === "pendiente" && veces < 40) reloj = setTimeout(() => mirarPendiente(veces + 1), 15000);
}
function conectarSuscripcion() {
  if ($("#cancelar-sus")) $("#cancelar-sus").onclick = () => vistaCancelar();
  const f = $("#f-sus");
  if (f) f.onsubmit = (e) => { e.preventDefault(); suscribirme(f); };
  if (sus().actual?.estado === "pendiente") reloj = setTimeout(() => mirarPendiente(), 15000);
}

// ---------- Regreso de Mercado Pago después de poner la tarjeta (?suscripcion=…) ----------
function vistaRegresoSuscripcion() {
  let vista = "", intentos = 0;
  const poneVista = (clave, html) => { if (clave === vista) return false; vista = clave; clearTimeout(reloj); app.innerHTML = html; if ($("#ir-cuenta")) $("#ir-cuenta").onclick = abrirCuenta; return true; };
  const otraVez = (ms) => { clearTimeout(reloj); reloj = setTimeout(revisar, ms); };
  const alFinal = `<div class="acciones">${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div>`;
  async function revisar() {
    try {
      const d = await cuentaApi.get("/suscripcion/estado");
      if (cuenta) cuenta.suscripcion = d.suscripcion;
      const a = d.suscripcion?.actual;
      if (a && (a.estado === "en_prueba" || a.estado === "activa")) {
        quitarDeLaDireccion();
        poneVista("lista", `<section class="panel-paso"><div style="display:flex;gap:14px;align-items:center">${sparky("festejo", 6)}<div>${marca("sus.lista_t", null, "h1")}</div></div>
          ${estadoSus(a, "p")}
          <div class="acciones"><a class="boton" href="crear.html?saldo=1" data-i18n="cta.crear">${th("cta.crear")}</a>${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}${marca("sus.nota_guias", null, "span", 'class="ayuda"')}</div></section>`);
        return;
      }
      if (a?.estado === "pendiente" && a.falta === "cobro") {
        poneVista("cobro", `<section class="panel-paso"><div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div>${marca("sus.confirmando", null, "h2")}</div>
          <div class="caja-clave">${marca("sus.e_falta_cobro", null, "p", 'style="margin:0"')}</div>${marca("sus.puedes_cerrar", null, "p", 'class="ayuda" style="text-align:center"')}${alFinal}</section>`);
        return otraVez(++intentos < 40 ? 10000 : 30000);
      }
      if (a?.estado === "pendiente") {
        // Todavía sin tarjeta: puede que no haya terminado en Mercado Pago. A los pocos segundos se le ofrece continuar.
        intentos++;
        poneVista("tarjeta:" + (intentos > 3), `<section class="panel-paso"><div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div>${marca("sus.confirmando", null, "h2")}</div>
          ${intentos > 3 ? `${marca("sus.sin_terminar", null, "p", 'style="text-align:center"')}<div class="acciones">${a.link_pago ? `<a class="boton" href="${esc(a.link_pago)}" data-i18n="sus.continuar_mp">${th("sus.continuar_mp")}</a>` : ""}${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div>` : ""}</section>`);
        return otraVez(intentos < 60 ? 5000 : 30000);
      }
      // No quedó ninguna suscripción en curso (por ejemplo, no se pudo activar): «Mi cuenta» dice qué pasó.
      quitarDeLaDireccion(); location.hash = "suscripcion"; abrirCuenta();
    } catch (e) {
      if (e.status === 401) return sesionTermino();
      poneVista("error:" + e.message, `<section class="panel-paso"><p class="error" data-i18n-servidor="${esc(e.message)}">${esc(mensajeError(e))}</p>${alFinal}</section>`);
      otraVez(8000);
    }
  }
  pintar(cargando("sus.confirmando"));
  revisar();
}

// ---------- Cancelar la suscripción: un botón y una sola confirmación con la fecha de fin ----------
function vistaCancelar() {
  const a = sus().actual;
  if (!a?.puede_cancelar) { quitarDeLaDireccion("cancelar"); location.hash = "suscripcion"; return vistaCuenta(); }
  const pendiente = a.estado === "pendiente", conPeriodo = (a.estado === "en_prueba" || a.estado === "activa") && new Date(a.periodo_fin).getTime() > Date.now();
  const texto = pendiente ? marca("sus.cancelar_pend", null, "p") : conPeriodo ? marca(a.estado === "en_prueba" ? "sus.cancelar_prueba" : "sus.cancelar_texto", { dia: a.periodo_fin }, "p") : marca("sus.cancelar_ya", null, "p");
  pintar(`<section class="panel-paso">
    <div class="cta-sello">${marca("cta.sello")}</div>
    ${marca("sus.cancelar_t", null, "h1")}
    ${texto}
    <div class="acciones">${marca("sus.si_cancelar", null, "button", 'class="boton" type="button" id="si-cancelar"')}${marca("sus.no_cancelar", null, "button", 'class="boton linea" type="button" id="no-cancelar"')}</div>
    <div class="error" id="err-cancelar" role="alert" style="text-align:center"></div>
  </section>`);
  $("#no-cancelar").onclick = abrirCuenta;
  $("#si-cancelar").onclick = async () => {
    const boton = $("#si-cancelar"); boton.disabled = true; $("#no-cancelar").disabled = true; poner(boton, "sus.cancelando");
    try {
      const r = await cuentaApi.post("/suscripcion/cancelar");
      if (cuenta && r.suscripcion) cuenta.suscripcion = r.suscripcion;
      quitarDeLaDireccion();
      const adios = r.estado !== "cancelada" ? marca("sus.descartada", null, "p") : r.hasta ? marca("sus.adios", { dia: r.hasta }, "p") : marca("sus.adios_ya", null, "p");
      pintar(`<section class="panel-paso">
        ${marca(r.estado === "cancelada" ? "sus.cancelada_t" : "sus.descartada_t", null, "h1")}
        ${adios}
        ${r.estado === "cancelada" ? marca("sus.comprobante", { folio: r.folio ?? "" }, "p", 'class="ayuda"') : ""}

// ---------- El código de 6 dígitos ----------
function vistaCodigo(datos, r) {
  const telefono = `+${datos.lada} ${datos.numero}`;
  const texto = (x) => marca(x.canal === "whatsapp" ? "cta.codigo_wa" : x.respaldo ? "cta.codigo_respaldo" : "cta.codigo_correo", { telefono, minutos: x.minutos ?? 10 }, "p", 'id="texto-codigo"');
  const rotulo = datos.comprar ? "cta.continuar_pago" : "cta.entrar";
  pintar(`<section class="panel-paso">
    <div class="cta-sello">${datos.comprar ? marca("cta.sello_compra", { guias: info?.guias ?? 3 }) : marca("cta.sello")}</div>
    ${marca("cta.codigo_t", null, "h1")}
    ${texto(r)}
    <form id="f-codigo" novalidate style="display:flex;flex-direction:column;gap:12px">
      <div class="campo">${marca("cta.codigo_etiqueta", null, "label", 'for="c-codigo"')}<input id="c-codigo" class="codigo-entrada" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" required></div>
      <div class="acciones">${marca(rotulo, null, "button", 'class="boton" type="submit" id="entrar"')}</div>
      <div class="error" id="err-codigo" role="alert" style="text-align:center"></div>
      <div class="ok-nota" id="nota-codigo" role="status" style="text-align:center"></div>
    </form>
    <div class="cta-enlaces"><button type="button" class="enlace" id="otro" disabled></button>${marca("cta.por_correo", null, "button", `type="button" class="enlace" id="por-correo"${r.canal === "correo" ? " hidden" : ""}`)}${marca("cta.cambiar_numero", null, "button", 'type="button" class="enlace" id="cambiar"')}</div>
  </section>`);
  const campo = $("#c-codigo"), err = $("#err-codigo"), nota = $("#nota-codigo"), otro = $("#otro"), boton = $("#entrar");
  campo.focus();
  // «Mandar otro código» se enciende a los 30 segundos (el servidor también frena: 3 códigos por hora por número).
  let faltan = 30;
  const pintaOtro = () => { otro.disabled = faltan > 0; if (faltan > 0) poner(otro, "cta.otro_codigo_en", { n: faltan }); else poner(otro, "cta.otro_codigo"); };
  pintaOtro();
  const cuenta30 = setInterval(() => { if (!document.body.contains(otro)) { clearInterval(cuenta30); return; } if (faltan > 0) { faltan--; pintaOtro(); } }, 1000);
  const reenviar = async (canal) => {
    sinError(err); sinError(nota);
    try {
      const r2 = await pedirCodigo(datos, canal);
      faltan = 30; pintaOtro(); campo.value = ""; campo.focus();
      $("#texto-codigo").outerHTML = texto(r2);
      if (r2.canal === "correo") $("#por-correo").hidden = true;
      poner(nota, r2.canal === "correo" ? "cta.codigo_a_correo" : "cta.codigo_enviado");
    } catch (e) { errorDe(err, e); }
  };
  otro.onclick = () => reenviar(null);
  $("#por-correo").onclick = () => reenviar("correo");
  $("#cambiar").onclick = () => vistaEntrar({ comprar: datos.comprar });
  let enviando = false;
  const entrar = async () => {
    const codigo = campo.value.replace(/\D/g, "");
    if (codigo.length !== 6) { poner(err, "cta.err_codigo"); campo.focus(); return; }
    if (enviando) return;
    enviando = true; boton.disabled = true; poner(boton, "cta.entrando"); sinError(err); sinError(nota);
    try {
      const s = await api.post("/cuenta/entrar", { telefono: datos.telefono, codigo });
      guardarPase(s.sesion); cuenta = s; despuesDeEntrar(datos);
    } catch (e) {
      if (e.status === 409 && e.datos?.limite) { vistaLimite(datos, codigo, e.datos); return; }
      errorDe(err, e); enviando = false; boton.disabled = false; poner(boton, rotulo); campo.select();
    }
  };
  $("#f-codigo").onsubmit = (e) => { e.preventDefault(); entrar(); };
  // Al completar los 6 dígitos se manda solo (por ejemplo, al pegar el código o al usar el que sugiere el teclado).
  campo.addEventListener("input", (e) => { if (e.inputType !== "deleteContentBackward" && campo.value.replace(/\D/g, "").length === 6) entrar(); });
}

async function comprar(datos = {}) {

  if (faltaNombre || faltaCorreo) return vistaDatosCompra(faltaNombre, faltaCorreo);
  pintar(cargando("pago.preparando"));
  try {
    const r = await cuentaApi.post("/paquete/comprar", { ...(datos.nombre ? { nombre: datos.nombre } : {}), ...(datos.correo ? { correo: datos.correo } : {}) });
    if (r.modo === "mercadopago" && r.url) {
      // La dirección queda sin «comprar»: si la familia regresa con el botón Atrás, ve su cuenta y no vuelve a salir al pago.
      quitarDeLaDireccion();
      poner($(".estado-carga h2"), "pago.abriendo");
      location.href = r.url; return;
    }
    quitarDeLaDireccion();
    pintar(`<section class="panel-paso">${marca("cta.apartado_t", null, "h1")}${marca("cta.apartado", { folio: r.folio ?? "" }, "p")}<div class="acciones">${marca("cta.ir_cuenta", null, "button", 'class="boton" type="button" id="ir-cuenta"')}</div></section>`);
    $("#ir-cuenta").onclick = abrirCuenta;
  } catch (e) {
    if (e.status === 401) return sesionTermino();
    if (e.datos?.campo) return vistaDatosCompra(true, true, e);
    pintar(`<section class="panel-paso"><p class="error" data-i18n-servidor="${esc(e.message)}">${esc(mensajeError(e))}</p><div class="acciones">${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div></section>`);
    $("#ir-cuenta").onclick = abrirCuenta;
  }
}
async function abrirCuenta() {
  quitarDeLaDireccion();
  try { if (await cargarCuenta()) vistaCuenta(); else vistaEntrar(); }
  catch (e) { pintar(`<section class="panel-paso"><p class="error" data-i18n-servidor="${esc(e.message)}">${esc(mensajeError(e))}</p></section>`); }
}
// La cuenta todavía no tiene nombre o correo (por ejemplo, entró sin comprar): se piden antes de pagar.
function vistaDatosCompra(faltaNombre, faltaCorreo, error = null) {
  const p = cuenta?.paquete ?? info ?? {};
  pintar(`<section class="panel-paso">
    <div class="cta-sello">${marca("cta.sello_compra", { guias: p.guias ?? 3 })}</div>
    ${marca("cta.datos_compra_t", null, "h1")}
    ${marca("cta.datos_compra_texto", null, "p")}
    <form id="f-datos" class="rejilla-campos" novalidate>
      ${faltaNombre ? `<div class="campo" style="grid-column:1/-1">${marca("cta.nombre", null, "label", 'for="d-nombre"')}<input id="d-nombre" name="nombre" autocomplete="name" maxlength="80" required value="${esc(cuenta?.cuenta?.nombre ?? "")}"></div>` : ""}
      ${faltaCorreo ? `<div class="campo">${marca("cta.correo", null, "label", 'for="d-correo"')}<input id="d-correo" name="correo" type="email" autocomplete="email" required></div>
      <div class="campo">${marca("cta.correo2", null, "label", 'for="d-correo2"')}<input id="d-correo2" name="correo2" type="email" autocomplete="off" required></div>` : ""}
      <div class="acciones" style="grid-column:1/-1">${marca("cta.ir_a_pagar", { precio: p.precio ?? "" }, "button", 'class="boton" type="submit"')}${marca("cta.cancelar", null, "button", 'class="boton linea" type="button" id="no-comprar"')}</div>
      <div class="error" id="err-datos" style="grid-column:1/-1" role="alert"></div>
    </form>
  </section>`);
  const f = $("#f-datos"), err = $("#err-datos");
  if (error) errorDe(err, error);
  $("#no-comprar").onclick = abrirCuenta;
  f.onsubmit = (e) => {
    e.preventDefault();
    const nombre = faltaNombre ? f.nombre.value.trim() : "", correo = faltaCorreo ? f.correo.value.trim().toLowerCase() : "";
    if (faltaNombre && nombre.length < 2) { poner(err, "cta.err_nombre"); f.nombre.focus(); return; }
    if (faltaCorreo && !CORREO_OK.test(correo)) { poner(err, "contacto.err_correo"); f.correo.focus(); return; }
    if (faltaCorreo && f.correo2.value.trim().toLowerCase() !== correo) { poner(err, "contacto.err_correo2"); f.correo2.focus(); return; }
    if (nombre) cuenta.cuenta.nombre = nombre;
    comprar({ ...(nombre ? { nombre } : {}), ...(correo ? { correo } : {}) });
  };
}

// ---------- Regreso de Mercado Pago: cómo va el pago del paquete ----------
function vistaCompra(id) {
  let vista = "", intentos = 0;
  const poneVista = (clave, html) => { if (clave === vista) return false; vista = clave; clearTimeout(reloj); app.innerHTML = html; return true; };
  const otraVez = (ms) => { clearTimeout(reloj); reloj = setTimeout(revisar, ms); };
  const reintentar = async (boton, err) => {
    boton.disabled = true; poner(boton, "pago.abriendo");
    try { const r = await cuentaApi.post(`/paquete/reintentar/${id}`); if (r.url) { quitarDeLaDireccion("pago", "status", "collection_status", "payment_id", "collection_id", "payment_type"); location.href = r.url; return; } vista = ""; revisar(); }
    catch (e) { if (e.status === 401) return sesionTermino(); errorDe(err, e); boton.disabled = false; poner(boton, "cta.pagar_ahora"); }
  };
  const alFinal = `<div class="acciones">${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div>`;
  const conBotonCuenta = () => { if ($("#ir-cuenta")) $("#ir-cuenta").onclick = abrirCuenta; };
  async function revisar() {
    try {
      const d = await cuentaApi.get(`/paquete/estado/${id}${/^\d+$/.test(pagoId) ? `?pago=${pagoId}` : ""}`);
      const pagoMP = d.pago_mp || "";
      if (d.estado === "pagada" && d.abonado) {
        poneVista("pagada", `<section class="panel-paso"><div style="display:flex;gap:14px;align-items:center">${sparky("festejo", 6)}<div>${marca("cta.pagado_t", { n: d.saldo?.guias ?? d.guias ?? 3 }, "h1")}</div></div>
          ${d.guias_vencen_en ? marca("cta.pagado", { dia: d.guias_vencen_en }, "p") : ""}
          <div class="acciones"><a class="boton" href="crear.html?saldo=1" data-i18n="cta.primera">${th("cta.primera")}</a>${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}${marca("cta.nota_guias", null, "span", 'class="ayuda"')}</div></section>`);
        conBotonCuenta(); return;
      }
      if (d.estado === "pagada") { poneVista("confirmando", cargando("cta.confirmando")); return otraVez(3000); }
      if (PAGO_VIVO.includes(pagoMP) || (!pagoMP && (regreso === "pendiente" || PAGO_VIVO.includes(estadoUrl)))) {
        const metodo = d.metodo || { ticket: "oxxo", bank_transfer: "spei", credit_card: "tarjeta", debit_card: "tarjeta", prepaid_card: "tarjeta" }[tipoUrl] || "";
        const [titulo, cuerpo, vence, ficha] = metodo === "oxxo" ? ["pend.oxxo_t", "cta.pend_oxxo", "pend.oxxo_vence", "pend.oxxo_ficha"] : metodo === "spei" ? ["pend.spei_t", "cta.pend_spei", "pend.spei_vence", "pend.spei_ficha"] : metodo === "tarjeta" ? ["pend.tarjeta_t", "cta.pend_tarjeta", "", ""] : ["pago.esperando", "cta.pend_otro", "", ""];
        poneVista(["pendiente", metodo, d.vence_en, d.ficha_url].join("|"), `<section class="panel-paso"><div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div>${marca(titulo, null, "h2")}</div>
          <div class="caja-clave">${marca(cuerpo, null, "p", 'style="margin:0"')}${vence && d.vence_en ? marca(vence, { fecha: d.vence_en }, "p", 'class="ayuda" style="margin:8px 0 0"') : ""}${ficha && d.ficha_url ? `<p class="acciones" style="margin:10px 0 0"><a class="boton linea" target="_blank" rel="noopener" href="${esc(d.ficha_url)}" data-i18n="${ficha}">${th(ficha)}</a></p>` : ""}</div>
          ${marca("cta.pend_nota", { folio: d.folio ?? "" }, "p", 'class="ayuda"')}${alFinal}</section>`);
        conBotonCuenta(); return otraVez(15000);
      }
      if (["rejected", "cancelled"].includes(pagoMP) || regreso === "fallido" || estadoUrl === "rejected") {
        const vencido = pagoMP === "cancelled";
        if (poneVista("fallido:" + vencido, `<section class="panel-paso"><div style="display:flex;gap:14px;align-items:center">${sparky("triste", 5)}<div>${marca(vencido ? "listo.vencido_t" : "listo.fallido_t", null, "h1")}</div></div>
          ${marca(vencido ? "listo.vencido" : "listo.fallido", null, "p")}
          <div class="acciones">${marca("listo.reintentar", null, "button", 'class="boton" type="button" id="otra-vez"')}${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div>
          <div class="error" id="err-compra" role="alert" style="text-align:center"></div></section>`)) {
          conBotonCuenta(); $("#otra-vez").onclick = () => reintentar($("#otra-vez"), $("#err-compra"));
        }
        return otraVez(15000);
      }
      // Sin noticias del pago: puede que no lo haya terminado. A los pocos segundos se le ofrece continuar.
      intentos++;
      if (poneVista("esperando:" + (intentos > 2), `<section class="panel-paso"><div class="estado-carga"><div class="sk-anima">${sparky("escribiendo", 5)}</div>${marca("pago.esperando", null, "h2")}</div>
        ${intentos > 2 ? `${marca("cta.sin_pagar", null, "p", 'style="text-align:center"')}<div class="acciones">${marca("cta.pagar_ahora", null, "button", 'class="boton" type="button" id="pagar-ahora"')}${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div><div class="error" id="err-compra" role="alert" style="text-align:center"></div>` : ""}</section>`) && intentos > 2) {
        conBotonCuenta(); $("#pagar-ahora").onclick = () => reintentar($("#pagar-ahora"), $("#err-compra"));
      }
      otraVez(5000);
    } catch (e) {
      if (e.status === 401) return sesionTermino();
      if (e.status === 404) { poneVista("no", `<section class="panel-paso">${marca("cta.compra_no", null, "p")}${alFinal}</section>`); conBotonCuenta(); return; }
      poneVista("error:" + e.message, `<section class="panel-paso"><p class="error" data-i18n-servidor="${esc(e.message)}">${esc(mensajeError(e))}</p>${alFinal}</section>`); conBotonCuenta();
      otraVez(8000);
    }
  }
  pintar(cargando("cta.confirmando"));
  revisar();
}

// ---------- Una guía hecha con saldo: se está creando, ya está lista o se devolvió ----------
function vistaGuia(id) {
  let vista = "";
  async function revisar() {
    try {
      const d = await cuentaApi.get(`/cuenta/guia/${id}`);
      if (d.estado === "lista") return lista(d);
      if (d.estado === "devuelta") return devuelta(d);
      if (vista !== "generando") {
        vista = "generando";
        app.innerHTML = `<section class="panel-paso"><div><div class="cta-sello">${marca("cta.sello")}</div>${d.titulo ? `<div class="ayuda">${esc(d.titulo)}</div>` : ""}</div><div id="espera"></div>${marca("cta.creando_nota", null, "p", 'class="ayuda" style="text-align:center"')}<div class="acciones">${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div></section>`;
        $("#ir-cuenta").onclick = abrirCuenta;
        espera = pantallaEspera($("#espera"), "espera.generando", { estimado: 300, inicio: d.iniciada_en ? new Date(d.iniciada_en).getTime() : Date.now(), base: 1 });
      }
      const pr = d.progreso ?? {};
      espera?.actualizar(pr.pct ?? 1, pr.mensaje ?? "");
      reloj = setTimeout(revisar, 4000);
    } catch (e) {
      if (e.status === 401) return sesionTermino();
      if (e.status === 404) { pintar(`<section class="panel-paso">${marca("cta.guia_no", null, "p")}<div class="acciones">${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div></section>`); $("#ir-cuenta").onclick = abrirCuenta; return; }
      reloj = setTimeout(revisar, 8000);
    }
  }
  function lista(d) {
    const link = d.link, nombre = d.titulo ?? "", n = Number(d.saldo?.guias) || 0, conSus = d.con_suscripcion === true, otra = n > 0 || sus().actual?.puede_crear === true;
    let svgQr = "";
    try { const qr = qrcode(0, "M"); qr.addData(link); qr.make(); svgQr = qr.createSvgTag({ cellSize: 5, margin: 2 }); } catch {}
    pintar(`<section class="panel-paso"><div style="display:flex;gap:14px;align-items:center">${sparky("festejo", 6)}<div>${marca("listo.lista", null, "h1")}<div class="ayuda">${nombre ? esc(nombre) : marca("tu_guia")}</div></div></div>
      <div style="display:grid;grid-template-columns:1fr;gap:16px" class="rejilla-campos entrega">
        ${svgQr ? `<div class="entrega-qr"><div class="qr">${svgQr}</div>${marca("listo.qr", null, "div", 'class="ayuda" style="margin-top:6px"')}</div>` : ""}
        <div style="display:flex;flex-direction:column;gap:10px">
          <div class="link-caja">${esc(link)}</div>
          <div class="acciones"><a class="boton" href="${esc(link)}" data-i18n="link.abrir">${th("link.abrir")}</a>${marca("link.copiar", null, "button", 'class="boton linea" type="button" id="copiar"')}<a class="boton linea" id="wa" target="_blank" rel="noopener" href="${esc(waLink("", mensajeWhatsApp(nombre || t("tu_guia"), link)))}" data-i18n="link.whatsapp">${th("link.whatsapp")}</a></div>
        </div></div>
      <div class="caja-clave">${marca("listo.acceso_t", null, "b")}<ul style="margin:8px 0 0;padding-left:20px">${conSus ? marca(d.expira_en ? "sus.acceso1_fecha" : "sus.acceso1", { fecha: d.expira_en }, "li") : d.expira_en ? marca("listo.acceso1_fecha", { fecha: d.expira_en }, "li") : marca("listo.acceso1", null, "li")}${marca("listo.acceso2", null, "li")}${marca("listo.acceso3", null, "li")}</ul></div>
      <div class="aviso-saldo"><span class="ico" aria-hidden="true">${conSus ? "♾️" : "🎟️"}</span>${conSus ? marca("sus.lista_nota") : n > 1 ? marca("cta.lista_saldo_n", { n }) : marca(n === 1 ? "cta.lista_saldo_1" : "cta.lista_saldo_0")}</div>
      <div class="acciones">${otra ? `<a class="boton linea" href="crear.html?saldo=1" data-i18n="cta.otra">${th("cta.otra")}</a>` : ""}${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div></section>`);
    $("#ir-cuenta").onclick = abrirCuenta;
    $("#copiar").onclick = async () => { try { await navigator.clipboard.writeText(link); poner($("#copiar"), "link.copiado"); } catch {} };
    redibujar = () => { $("#wa").href = waLink("", mensajeWhatsApp(nombre || t("tu_guia"), link)); };
  }
  function devuelta(d) {
    const n = Number(d.saldo?.guias) || 0, conSus = d.con_suscripcion === true, otra = n > 0 || sus().actual?.puede_crear === true;
    pintar(`<section class="panel-paso"><div style="display:flex;gap:14px;align-items:center">${sparky("triste", 5)}<div>${marca("cta.devuelta_t", null, "h1")}${d.titulo ? `<div class="ayuda">${esc(d.titulo)}</div>` : ""}</div></div>
      ${d.mensaje ? `<p data-i18n-servidor="${esc(d.mensaje)}">${esc(textoServidor(d.mensaje))}</p>` : ""}
      ${conSus ? "" : `<div class="aviso-saldo"><span class="ico" aria-hidden="true">🎟️</span>${n === 1 ? marca("cta.devuelta_1") : marca("cta.devuelta_n", { n })}</div>`}
      <div class="acciones">${otra ? `<a class="boton" href="crear.html?saldo=1" data-i18n="cta.reintentar">${th("cta.reintentar")}</a>` : ""}${marca("cta.ir_cuenta", null, "button", 'class="boton linea" type="button" id="ir-cuenta"')}</div></section>`);
    $("#ir-cuenta").onclick = abrirCuenta;
  }
  pintar(cargando("espera.generando"));
  revisar();
}

// ---------- Arranque ----------
try {
  info = await mostrarPaquete(document, true);
  const dentro = await cargarCuenta();
  if (!dentro) vistaEntrar({ comprar: quiereComprar, aviso: quiereCancelar ? "sus.entra_para_cancelar" : susUrl || quiereSuscribirse ? "sus.entra_para_ver" : compraUrl || guiaUrl ? "cta.entra_para_ver" : null });
  else if (guiaUrl) vistaGuia(guiaUrl);
  else if (susUrl) vistaRegresoSuscripcion();
  else if (compraUrl) vistaCompra(compraUrl);
  else if (quiereCancelar) vistaCancelar();
  else if (quiereComprar && cuenta.paquete?.disponible) comprar();
  else vistaCuenta();
} catch (e) {
  pintar(`<section class="panel-paso"><p class="error" data-i18n-servidor="${esc(e.message)}">${esc(mensajeError(e))}</p><div class="acciones"><button class="boton linea" type="button" onclick="location.reload()" data-i18n="boton.reintentar">${th("boton.reintentar")}</button></div></section>`);
}
</script>
